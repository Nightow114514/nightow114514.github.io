<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050805">
  <title>NightOwl</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 20px;
      overflow-x: hidden;
      background: radial-gradient(ellipse at center, #0b120d 0%, #050805 75%);
      font-family: "Consolas", "Courier New", monospace;
      color: #35ff7a;
    }

    /* 屏幕扫描线和暗角 */
    .crt {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      background:
        repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.25) 0px, rgba(0, 0, 0, 0.25) 1px, transparent 1px, transparent 3px),
        radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, 0.55) 100%);
    }

    .wrap {
      position: relative;
      z-index: 2;
      width: min(920px, 96vw);
    }

    .terminal {
      background: #0a100c;
      border: 1px solid rgba(53, 255, 122, 0.3);
      border-radius: 10px;
      overflow: hidden;
      box-shadow:
        0 0 60px rgba(53, 255, 122, 0.12),
        inset 0 0 60px rgba(53, 255, 122, 0.03);
    }

    .titlebar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      background: rgba(53, 255, 122, 0.06);
      border-bottom: 1px solid rgba(53, 255, 122, 0.18);
      font-size: 0.8rem;
      color: rgba(53, 255, 122, 0.75);
    }

    .dots { display: flex; gap: 6px; min-width: 60px; }
    .dots i {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
    }
    .dots i:nth-child(1) { background: #ff5f56; }
    .dots i:nth-child(2) { background: #ffbd2e; }
    .dots i:nth-child(3) { background: #27c93f; }

    .title { flex: 1; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pad { min-width: 60px; }

    .screen {
      padding: 26px 28px 30px;
      min-height: 380px;
      max-height: min(74vh, 720px);
      overflow-y: auto;
      font-size: 15px;
      line-height: 1.55;
      color: #35ff7a;
      text-shadow: 0 0 8px rgba(53, 255, 122, 0.45);
      animation: flicker 9s linear infinite;
      scrollbar-width: thin;
      scrollbar-color: rgba(53, 255, 122, 0.35) transparent;
    }

    .screen::-webkit-scrollbar { width: 8px; }
    .screen::-webkit-scrollbar-thumb {
      background: rgba(53, 255, 122, 0.3);
      border-radius: 4px;
    }

    @keyframes flicker {
      0%, 100% { opacity: 1; }
      3% { opacity: 0.97; }
      4% { opacity: 1; }
      61% { opacity: 0.98; }
      62% { opacity: 1; }
    }

    .banner {
      margin: 0 0 22px;
      font-size: clamp(7px, 2.6vw, 13px);
      line-height: 1.35;
      text-shadow:
        0 0 10px rgba(53, 255, 122, 0.7),
        0 0 28px rgba(53, 255, 122, 0.25);
    }

    .line {
      min-height: 1.5em;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .line.muted { color: rgba(53, 255, 122, 0.55); }

    .cursor {
      display: inline-block;
      width: 0.6em;
      height: 1.1em;
      margin-left: 0.12em;
      vertical-align: -0.15em;
      background: #35ff7a;
      box-shadow: 0 0 12px rgba(53, 255, 122, 0.9);
      animation: blink 1.1s steps(1) infinite;
    }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .statusbar {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 14px;
      border-top: 1px solid rgba(53, 255, 122, 0.18);
      font-size: 0.72rem;
      letter-spacing: 0.06em;
      color: rgba(53, 255, 122, 0.6);
      flex-wrap: wrap;
    }

    #hint { animation: blink 1.2s steps(1) infinite; }

    /* 隐藏的真实输入框：负责弹出手机键盘 */
    #cmd {
      position: fixed;
      top: 0;
      left: 0;
      width: 1px;
      height: 1px;
      opacity: 0;
      border: 0;
      padding: 0;
      background: transparent;
      color: transparent;
      caret-color: transparent;
    }

    @media (max-width: 560px) {
      body { padding: 10px; }
      .wrap { width: 100%; }
      .screen {
        padding: 18px 14px 22px;
        min-height: 300px;
        font-size: 12.5px;
      }
      .banner { font-size: clamp(7px, 2.4vw, 11px); }
      .title { font-size: 0.62rem; }
      .statusbar { font-size: 0.6rem; padding: 7px 10px; }
    }

    @media (max-width: 380px) {
      .screen { padding: 14px 10px 18px; font-size: 11.5px; }
      .banner { font-size: 7.5px; }
    }
  </style>
</head>
<body>
  <div class="crt" aria-hidden="true"></div>
  <div class="wrap">
    <div class="terminal">
      <div class="titlebar">
        <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="title">nightowl@nightowl.ren: ~ — bash</span>
        <span class="pad" aria-hidden="true"></span>
      </div>
      <div class="screen" id="screen" aria-live="polite"></div>
      <div class="statusbar">
        <span>NightOwl OS — TTY1</span>
        <span id="uptime">UPTIME 00:00:00</span>
        <span id="hint"></span>
      </div>
    </div>
  </div>
  <input id="cmd" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="命令输入">

  <script>
    var screen = document.getElementById("screen");
    var uptimeEl = document.getElementById("uptime");
    var hintEl = document.getElementById("hint");
    var cmdInput = document.getElementById("cmd");
    var state = "boot"; // boot | busy | input
    var promptText = "nightowl@nightowl:~$ ";
    var promptEl = null;

    var banner = [
      "█   █  █████   ███   █   █  █████   ███   █   █  █    ",
      "██  █    █    █      █   █    █    █   █  █   █  █    ",
      "█ █ █    █    █ ███  █████    █    █   █  █ █ █  █    ",
      "█  ██    █    █   █  █   █    █    █   █  ██ ██  █    ",
      "█   █  █████   ███   █   █    █     ███   █   █  █████"
    ];

    var bootLines = [
      { text: "[ OK ] Initializing owl modules", speed: 14, pause: 170 },
      { text: "[ OK ] Mounting study partition", speed: 14, pause: 170 },
      { text: "[ OK ] Loading focus engine", speed: 14, pause: 170 },
      { text: "[ OK ] Network ready: nightowl.ren", speed: 14, pause: 170 },
      { text: "[ OK ] All systems nominal", speed: 14, pause: 320 },
      { text: "" }
    ];

    function scrollDown() {
      screen.scrollTop = screen.scrollHeight;
    }

    function start() {
      state = "boot";
      hintEl.textContent = "";
      cmdInput.value = "";
      screen.innerHTML = "";

      var pre = document.createElement("pre");
      pre.className = "banner";
      screen.appendChild(pre);

      var row = 0;
      (function nextRow() {
        if (row < banner.length) {
          pre.textContent += banner[row] + "\n";
          row++;
          scrollDown();
          setTimeout(nextRow, 120);
        } else {
          typeLines(0);
        }
      })();
    }

    function typeLines(i) {
      if (i >= bootLines.length) {
        readyForInput();
        return;
      }
      var item = bootLines[i];
      var div = document.createElement("div");
      div.className = "line";
      screen.appendChild(div);
      var pos = 0;
      (function tick() {
        if (pos <= item.text.length) {
          div.textContent = item.text.slice(0, pos);
          pos++;
          scrollDown();
          setTimeout(tick, item.speed);
        } else {
          setTimeout(function () { typeLines(i + 1); }, item.pause);
        }
      })();
    }

    function readyForInput() {
      newPrompt();
      state = "input";
      hintEl.textContent = "TAP / CLICK HERE TO TYPE — 'help'";
      setTimeout(function () {
        try { cmdInput.focus({ preventScroll: true }); } catch (e) { cmdInput.focus(); }
      }, 60);
    }

    function newPrompt() {
      promptEl = document.createElement("div");
      promptEl.className = "line";
      screen.appendChild(promptEl);
      renderPrompt();
    }

    function renderPrompt() {
      if (!promptEl) return;
      promptEl.textContent = promptText + cmdInput.value;
      var cur = document.createElement("span");
      cur.className = "cursor";
      promptEl.appendChild(cur);
      scrollDown();
    }

    function printCommandLines(lines, done) {
      var i = 0;
      (function next() {
        if (i >= lines.length) {
          if (done) done();
          return;
        }
        var div = document.createElement("div");
        div.className = "line" + (lines[i].cls ? " " + lines[i].cls : "");
        screen.appendChild(div);
        var text = lines[i].text;
        var pos = 0;
        (function tick() {
          if (pos <= text.length) {
            div.textContent = text.slice(0, pos);
            pos++;
            scrollDown();
            setTimeout(tick, 10);
          } else {
            i++;
            setTimeout(next, 70);
          }
        })();
      })();
    }

    function runCommand() {
      var raw = cmdInput.value.trim();
      cmdInput.value = "";
      if (state !== "input") return;
      state = "busy";
      hintEl.textContent = "";
      var cmd = raw.toLowerCase();
      var lines;

      if (raw === "") {
        lines = [];
      } else if (cmd === "help") {
        lines = [
          { text: "available commands:" },
          { text: "  help     show this list" },
          { text: "  ls       list directories" },
          { text: "  clear    clear the screen" },
          { text: "  reboot   reboot the system" },
          { text: "  (hint: some commands are hidden)" }
        ];
      } else if (cmd === "ls") {
        lines = [{ text: "study/  notes/  ideas/" }];
      } else if (cmd === "father") {
        lines = [
          { text: "[ OK ] father detected" },
          { text: "  陈祖鹏" },
          { text: "[ OK ] connection established" }
        ];
      } else if (cmd === "clear") {
        screen.innerHTML = "";
        newPrompt();
        state = "input";
        hintEl.textContent = "TAP / CLICK HERE TO TYPE — 'help'";
        cmdInput.focus();
        return;
      } else if (cmd === "reboot") {
        start();
        return;
      } else {
        lines = [{ text: "bash: " + raw + ": command not found" }];
      }

      printCommandLines(lines, function () {
        newPrompt();
        state = "input";
        hintEl.textContent = "TAP / CLICK HERE TO TYPE — 'help'";
        cmdInput.focus();
      });
    }

    cmdInput.addEventListener("input", function () {
      if (state === "input") renderPrompt();
    });

    cmdInput.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && state === "input") {
        e.preventDefault();
        runCommand();
      }
    });

    document.addEventListener("click", function () {
      if (state === "input") cmdInput.focus();
    });

    document.addEventListener("keydown", function () {
      if (state === "input") cmdInput.focus();
    });

    var seconds = 0;
    setInterval(function () {
      seconds++;
      var m = String(Math.floor(seconds / 60)).padStart(2, "0");
      var s = String(seconds % 60).padStart(2, "0");
      uptimeEl.textContent = "UPTIME 00:" + m + ":" + s;
    }, 1000);

    start();
  </script>
</body>
</html>
